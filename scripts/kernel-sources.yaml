# Upstream kernel sources for 'make deb-setup', used by
# scripts/fetch-kernel-source.sh. Sources are tried in order until one
# works.
#
# To use a different list, copy this file and set KERNEL_SOURCES:
#
#   KERNEL_SOURCES=$PWD/my-sources.yaml make deb-setup
#   ./docker-build.sh --docker-arg "-e KERNEL_SOURCES=/build/debian-kernel/my-sources.yaml" deb
#
# kernel-sources.yaml.sha256 records the checksum of this file; the build
# log warns when the list in use doesn't match it. After changing this
# file, update it with:
#
#   cd scripts && sha256sum kernel-sources.yaml > kernel-sources.yaml.sha256
#
# Fields:
#   name     shown in the build log, defaults to the URL
#   url      {major} is replaced by e.g. 6, {ver} by 6.18.60, 6.18 or 7.3-rc3
#   type     tarball or git (sources only)
#   enabled  default true

# sha256sums.asc files that downloaded tarballs are checked against. The
# first one that has the version is used. Tarball sources are skipped if
# none is reachable.
checksums:
  - name: kernel.org CDN
    url: https://cdn.kernel.org/pub/linux/kernel/v{major}.x/sha256sums.asc
  - name: kernel.org mirror
    url: https://mirrors.edge.kernel.org/pub/linux/kernel/v{major}.x/sha256sums.asc

# tarball: linux-{ver}.tar.xz, not available for -rc releases.
# git:     shallow clone of tag v{ver}; the tag signature is checked
#          against debian/upstream/signing-key.asc.
sources:
  - name: kernel.org CDN
    type: tarball
    url: https://cdn.kernel.org/pub/linux/kernel/v{major}.x/linux-{ver}.tar.xz

  - name: kernel.org mirror
    type: tarball
    url: https://mirrors.edge.kernel.org/pub/linux/kernel/v{major}.x/linux-{ver}.tar.xz

  - name: Tsinghua mirror
    type: tarball
    url: https://mirrors.tuna.tsinghua.edu.cn/kernel/v{major}.x/linux-{ver}.tar.xz

  - name: Aliyun mirror
    type: tarball
    url: https://mirrors.aliyun.com/linux-kernel/v{major}.x/linux-{ver}.tar.xz

  - name: kernel.org git
    type: git
    url: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git

  - name: Google git mirror
    type: git
    url: https://kernel.googlesource.com/pub/scm/linux/kernel/git/stable/linux.git

  - name: GitHub git mirror
    type: git
    url: https://github.com/gregkh/linux.git
